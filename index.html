<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome Screen Loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; height:100%; background:#05080f; overflow:hidden; cursor:none }
  /* 1920x1080 stage, scaled to fit any screen (4K included) */
  #stage { position:absolute; left:50%; top:50%; width:1920px; height:1080px; transform-origin:0 0; overflow:hidden;
    --ground:#0A1020; --main:#2E4A7A; --second:#FFFFFF;
    background:var(--ground); color:var(--second); font-family:'Montserrat', 'Helvetica Neue', Arial, sans-serif }
  .layer { position:absolute; inset:0 }
  .wash { background:linear-gradient(120deg, color-mix(in srgb, var(--main) 50%, #1d6a80) 0%, color-mix(in srgb, var(--main) 55%, var(--ground)) 20%, color-mix(in srgb, #241040 75%, var(--ground)) 48%, color-mix(in srgb, #2a2a5a 70%, var(--ground)) 72%, color-mix(in srgb, var(--main) 45%, var(--ground)) 100%) }
  .glow { position:absolute; border-radius:50%; background:radial-gradient(closest-side, color-mix(in srgb, var(--tint) 55%, transparent), transparent); filter:blur(30px); will-change:transform, opacity }
  #mesh { position:absolute; left:0; top:0; width:1920px; height:1080px }
  .floor { background:linear-gradient(180deg, transparent 48%, rgba(5,10,16,.92) 100%) }
  .hush { background:radial-gradient(42% 30% at 50% 50%, rgba(10,16,32,.22), transparent) }
  .center { position:absolute; left:0; right:0; display:flex; justify-content:center; align-items:center }
  .words { position:absolute; left:0; right:0; top:330px; display:flex; flex-direction:column; align-items:center; gap:40px; text-align:center }
  .words > * { margin:0 }
  .eyebrow { font-size:82px; font-weight:300; line-height:1; letter-spacing:.01em }
  .display { font-size:204px; font-weight:300; line-height:1; letter-spacing:.005em }
  #client-logo { max-width:300px; max-height:110px; width:auto; height:auto; display:block }
</style>
</head>

<script>
(() => {
  const W = 1920, H = 1080, LOOP = 6;            // loop length in seconds
  const TAU = Math.PI * 2;
  const stage = document.getElementById('stage');
  const cv = document.getElementById('mesh'), c = cv.getContext('2d');
  const g = id => document.getElementById(id).style;
  const g1 = g('g1'), g2 = g('g2'), g3 = g('g3'), g4 = g('g4');
  const lerp = (a, b, p) => a + (b - a) * p;

  // Fit stage to window; size canvas to real device pixels so the mesh stays crisp on 4K
  let k = 1;
  function fit() {
    const s = Math.min(innerWidth / W, innerHeight / H);
    stage.style.transform = 'scale(' + s + ') translate(-50%,-50%)';
    k = s * (window.devicePixelRatio || 1);
    cv.width = Math.round(W * k); cv.height = Math.round(H * k);
  }
  addEventListener('resize', fit); fit();

  // Mesh wave
  const C = 84, R = 28, X0 = -2.4, X1 = 3.4, N = C * R;
  const g2d = (x, z, cx, cz, sx, sz) => { const a = x - cx, b = z - cz; return Math.exp(-(a * a / sx + b * b / sz)); };
  const hA = (x, z) => 0.5 * g2d(x, z, 1.6, 0.5, 0.45, 0.3) + 0.18 * g2d(x, z, 0.2, 0.5, 1.2, 0.5) + 0.05 * Math.sin(2.2 * x + 1.3 * z);
  const hB = (x, z) => 0.32 * g2d(x, z, 0.6, 0.45, 0.35, 0.25) + 0.45 * g2d(x, z, 2.2, 0.7, 0.4, 0.35) + 0.08 * Math.sin(3.1 * x - 2 * z + 0.8);
  const rowA = z => Math.pow(Math.sin(Math.PI * Math.min(1, z * 1.08 + 0.05)), 1.3) * 0.38;
  let seed = 11; const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
  const px = new Float32Array(N), py = new Float32Array(N), pd = new Float32Array(N);
  const jx = new Float32Array(N), jz = new Float32Array(N), jy = new Float32Array(N), m = new Uint8Array(N);
  for (let i = 0; i < N; i++) {
    jx[i] = (rnd() - .5) * .06; jz[i] = (rnd() - .5) * .034; jy[i] = (rnd() - .5) * .04;
    m[i] = (rnd() < .85 ? 1 : 0) | (rnd() < .6 ? 2 : 0) | (rnd() < .6 ? 4 : 0) | (rnd() < .9 ? 8 : 0);
  }

  function render(t) {
    const ph = TAU * t / LOOP;
    const w = 0.5 - 0.5 * Math.cos(ph);            // 0 → 1 → 0, sinusoidal ease
    g1.transform = 'translate(' + lerp(0, 230, w) + 'px,' + lerp(0, -240, w) + 'px) rotate(' + lerp(-10, -32, w) + 'deg) scale(' + lerp(1, .9, w) + ')';
    g1.opacity = lerp(.7, .9, w);
    g2.transform = 'translate(0px,' + lerp(0, 60, w) + 'px)'; g2.opacity = lerp(.45, .7, w);
    g3.opacity = .62 + .12 * Math.sin(ph);
    g4.opacity = lerp(.4, .6, w);

    for (let r = 0; r < R; r++) for (let i = 0; i < C; i++) {
      const q = r * C + i;
      const z = Math.min(1, Math.max(0, r / (R - 1) + jz[q])), d = 1 + z * 3.2;
      const x = X0 + (X1 - X0) * i / (C - 1) + jx[q];
      const y = lerp(hA(x, z), hB(x, z), w) + jy[q] + .03 * Math.sin(3.5 * x + 2.5 * z - ph);
      px[q] = 1000 + 1100 * x / d; py[q] = 500 + (.6 - y) * 820 / d; pd[q] = d;
    }
    c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, cv.width, cv.height);
    c.setTransform(k, 0, 0, k, 0, 0);
    const grad = c.createLinearGradient(380, 0, 1800, 0);
    grad.addColorStop(0, 'rgba(150,175,215,0)'); grad.addColorStop(.4, 'rgba(160,185,225,.5)'); grad.addColorStop(1, 'rgba(185,212,232,1)');
    c.strokeStyle = grad; c.fillStyle = grad;
    for (let r = 0; r < R; r++) {
      const z = r / (R - 1), a = rowA(z), o = r * C, nx = o + C;
      c.lineWidth = 1.1 - z * .5;
      c.globalAlpha = r < R - 1 ? (a + rowA((r + 1) / (R - 1))) / 2 : a;
      c.beginPath();
      for (let i = 0; i < C - 1; i++) {
        const q = o + i, f = m[q];
        if (f & 1) { c.moveTo(px[q], py[q]); c.lineTo(px[q + 1], py[q + 1]); }
        if (r < R - 1) {
          if (f & 8) { c.moveTo(px[q], py[q]); c.lineTo(px[nx + i], py[nx + i]); }
          if (f & 2) { c.moveTo(px[q], py[q]); c.lineTo(px[nx + i + 1], py[nx + i + 1]); }
          if (f & 4) { c.moveTo(px[q + 1], py[q + 1]); c.lineTo(px[nx + i], py[nx + i]); }
        }
      }
      c.stroke();
      c.globalAlpha = Math.min(1, a * 1.2);
      c.beginPath();
      for (let i = 0; i < C; i++) {
        const q = o + i; if (!(m[q] & 1)) continue;
        const rad = 2.4 / Math.pow(pd[q], .7);
        c.moveTo(px[q] + rad, py[q]); c.arc(px[q], py[q], rad, 0, TAU);
      }
      c.fill();
    }
    c.globalAlpha = 1;
  }

  const t0 = performance.now();
  (function frame(now) { render(((now - t0) / 1000) % LOOP); requestAnimationFrame(frame); })(t0);
})();
